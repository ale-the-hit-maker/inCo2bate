; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
lib_ldf_mode = deep+

; --- FIX LITTLEFS ---
; Diciamo al compilatore di usare una tabella partizioni che include lo spazio dati (SPIFFS/LittleFS)
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

monitor_speed = 115200

lib_deps =
    arduino-libraries/Ethernet @ ^2.0.2
    knolleary/PubSubClient @ ^2.8
    adafruit/Adafruit SHT4x Library @ ^1.0.4
    bblanchon/ArduinoJson @ ^6.21.3

build_flags =
    -D MQTT_BROKER_HOST=\"192.168.1.100\"

; ===================================================================
; [ADATTATO] Ambiente di simulazione Wokwi
; ===================================================================
; Build target per la simulazione: compila senza libreria Ethernet reale,
; usando mock_ethernet.h per simulare una connessione Ethernet.
; Consente di testare le funzioni di telemetria e backlog offline.
;
; Utilizzo:
;   pio run -e esp32-c3-devkitm-1-sim            (build solo)
;   pio run -e esp32-c3-devkitm-1-sim -t upload  (build + upload)
; ===================================================================

[env:esp32-c3-devkitm-1-sim]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
lib_ldf_mode = deep+

board_build.partitions = partitions.csv
board_build.filesystem = littlefs

monitor_speed = 115200

lib_deps =
    knolleary/PubSubClient @ ^2.8
    adafruit/Adafruit SHT4x Library @ ^1.0.4
    bblanchon/ArduinoJson @ ^6.21.3

build_flags =
    -D MQTT_BROKER_HOST=\"192.168.1.100\"
    -D WOKWI_SIM

; ===================================================================
; [ADATTATO] Ambiente di simulazione Wokwi con Wi-Fi reale
; ===================================================================
; Build target per simulazione con traffico di rete reale: compila
; con WiFi.h + WiFiClient al posto di Ethernet. L'ESP32 si connette
; a "Wokwi-GUEST" (SSID Wokwi) e raggiunge il broker MQTT via rete host.
;
; Utilizzo:
;   pio run -e esp32-c3-devkitm-1-wifi-sim            (build solo)
;   pio run -e esp32-c3-devkitm-1-wifi-sim -t upload  (build + upload)
; ===================================================================

[env:esp32-c3-devkitm-1-wifi-sim]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
lib_ldf_mode = deep+

board_build.partitions = partitions.csv
board_build.filesystem = littlefs

monitor_speed = 115200

lib_deps =
    knolleary/PubSubClient @ ^2.8
    adafruit/Adafruit SHT4x Library @ ^1.0.4
    bblanchon/ArduinoJson @ ^6.21.3

; In simulazione Wokwi il broker MQTT gira sul TUO PC (Docker): si raggiunge tramite
; l'hostname speciale di Wokwi 'host.wokwi.internal' (porta 1883 dell'host).
; Per hardware reale su LAN usare invece l'IP del broker (es. 192.168.1.100).
build_flags =
    -D MQTT_BROKER_HOST=\"host.wokwi.internal\"
    -D WOKWI_WIFI_SIM
