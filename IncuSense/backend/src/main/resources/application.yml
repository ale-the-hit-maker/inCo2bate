server:
  port: 8080

spring:
  application:
    name: incusense-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://timescaledb:5432/incusense}
    username: ${SPRING_DATASOURCE_USERNAME:incusense_user}
    password: ${SPRING_DATASOURCE_PASSWORD:incusense_secret}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    time-zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

incusense:
  mqtt:
    broker-url: ${MQTT_BROKER_URL:tcp://mosquitto:1883}
    client-id: ${MQTT_CLIENT_ID:incusense-backend-01}
    topic: ${MQTT_TOPIC:incusense/hubs/+/telemetry}
  jwt:
    secret: ${JWT_SECRET:incusense-dev-secret-key-change-in-prod-min-256bit}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  security:
    admin-username: ${INCUSENSE_ADMIN_USERNAME:admin}
    admin-password: ${INCUSENSE_ADMIN_PASSWORD:admin123}
