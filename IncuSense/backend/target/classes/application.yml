server:
  port: 8080

spring:
  application:
    name: incusense-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://timescaledb:5432/incusense}
    username: ${SPRING_DATASOURCE_USERNAME:incusense_user}
    password: ${SPRING_DATASOURCE_PASSWORD:incusense_secret}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    time-zone: UTC
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          starttls:
            enable: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    # Do not probe SMTP during health checks: when email is unconfigured the mail
    # indicator would block/fail /actuator/health (connect to localhost:587).
    mail:
      enabled: false

incusense:
  mqtt:
    broker-url: ${MQTT_BROKER_URL:tcp://mosquitto:1883}
    client-id: ${MQTT_CLIENT_ID:incusense-backend-01}
    topic: ${MQTT_TOPIC:incusense/labs/+/hubs/+/telemetry}
    status-topic: ${MQTT_STATUS_TOPIC:incusense/labs/+/hubs/+/status}
    ack-topic: ${MQTT_ACK_TOPIC:incusense/labs/+/hubs/+/ack}
  jwt:
    secret: ${JWT_SECRET:incusense-dev-secret-key-change-in-prod-min-256bit}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  security:
    admin-username: ${INCUSENSE_ADMIN_USERNAME:admin}
    admin-password: ${INCUSENSE_ADMIN_PASSWORD:admin123}
    operator-username: ${INCUSENSE_OPERATOR_USERNAME:operator}
    operator-password: ${INCUSENSE_OPERATOR_PASSWORD:operator123}
    # Self-registration is OFF in the prototype; set true to restore POST /api/auth/register.
    registration-enabled: ${REGISTRATION_ENABLED:false}
  alerting:
    from-address: ${ALERT_FROM:incusense@localhost}
    cooldown-seconds: ${ALERT_COOLDOWN:300}
  drift:
    degrading-eol-days: ${DRIFT_EOL_DAYS:7}
  autocal:
    # Loop chiuso di auto-calibrazione (piattaforma -> nodo). OFF di default: non pubblica
    # comandi verso i nodi finche' non viene attivato esplicitamente (nessuna regressione
    # sul percorso esistente prima della verifica E2E). Vedi docs/AUTOCAL_v1_design.md.
    enabled: ${AUTOCAL_ENABLED:false}
    setpoint-ppm: ${AUTOCAL_SETPOINT_PPM:50000}        # concentrazione vera di riferimento (incubatore)
    setpoint-tol-ppm: ${AUTOCAL_SETPOINT_TOL_PPM:3000} # gating "a regime" + verifica post-cal
    heater-target-c: ${AUTOCAL_HEATER_TARGET_C:250}
    heater-tol-c: ${AUTOCAL_HEATER_TOL_C:15}
    action-threshold-pct: ${AUTOCAL_ACTION_THRESHOLD_PCT:5}  # banda OK/ACTIONABLE sul drift
    eol-threshold-pct: ${AUTOCAL_EOL_THRESHOLD_PCT:20}       # oltre: solo alert, niente correzione
    ewma-alpha: ${AUTOCAL_EWMA_ALPHA:0.2}                    # smoothing del response a regime
    min-samples: ${AUTOCAL_MIN_SAMPLES:20}                   # campioni a regime minimi prima di agire
    min-hours-between-cmd: ${AUTOCAL_MIN_HOURS_BETWEEN_CMD:12}
    # guard-rail ampiezza correzione. NB: con b=0.254 e setpoint 50k il bridge drift->ppm
    # amplifica (drift response 5% => ~9800 ppm stimati): valore tarato sulla scala incubatore,
    # da validare con i dataset reali (docs/AUTOCAL_dataset_spec.md).
    max-offset-ppm: ${AUTOCAL_MAX_OFFSET_PPM:15000}
    verify-samples: ${AUTOCAL_VERIFY_SAMPLES:10}            # campioni post-cal per VERIFIED/FAILED
  demo:
    # Modalità demo per il pitch: abilita /api/demo/* (iniezione di telemetria
    # sintetica nel percorso reale → alert + email veri). Disattivare in produzione.
    enabled: ${DEMO_ENABLED:true}
